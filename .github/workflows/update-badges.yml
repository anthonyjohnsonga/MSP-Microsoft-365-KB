name: Update README badges

# Recounts the Article Index table and rewrites the article/product-area
# badge numbers in README.md so they never drift from the actual content.

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-badges
  cancel-in-progress: false

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Count articles and product areas
        id: counts
        run: |
          set -euo pipefail

          # Index rows are the only lines whose first cell is bold: | **Area** | ...
          articles=$(grep -cE '^\|[[:space:]]*\*\*' README.md)

          # Distinct bold values in the first cell = product areas.
          areas=$(grep -oE '^\|[[:space:]]*\*\*[^*]+\*\*' README.md \
            | sed -E 's/^\|[[:space:]]*\*\*//; s/\*\*$//' \
            | sort -u | wc -l)

          if [ "$articles" -eq 0 ] || [ "$areas" -eq 0 ]; then
            echo "::error::Parsed 0 articles or 0 areas — the Article Index table format changed."
            exit 1
          fi

          echo "articles=$articles" >> "$GITHUB_OUTPUT"
          echo "areas=$areas" >> "$GITHUB_OUTPUT"
          echo "Found $articles articles across $areas product areas."

      - name: Rewrite badge values
        run: |
          set -euo pipefail
          sed -i -E \
            -e 's|badge/articles-[0-9]+-|badge/articles-${{ steps.counts.outputs.articles }}-|' \
            -e 's|badge/product%20areas-[0-9]+-|badge/product%20areas-${{ steps.counts.outputs.areas }}-|' \
            README.md

      - name: Open pull request if changed
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/update-badge-counts
          ARTICLES: ${{ steps.counts.outputs.articles }}
          AREAS: ${{ steps.counts.outputs.areas }}
        run: |
          set -euo pipefail

          if git diff --quiet -- README.md; then
            echo "Badges already up to date."
            # Nothing left to propose — retire any PR still open from an earlier run.
            gh pr close "$BRANCH" --delete-branch --comment 'Badge counts are current on main.' 2>/dev/null || true
            exit 0
          fi

          git config user.name  'anthonyjohnsonga'
          git config user.email 'anthony@johnson2.us'
          git switch -c "$BRANCH"
          git add README.md
          git commit -m "Update README badge counts to ${ARTICLES} articles / ${AREAS} areas"

          # Force-push so a still-open PR from a previous run just picks up the new numbers.
          git push --force origin "$BRANCH"

          if gh pr view "$BRANCH" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            echo "Existing PR updated."
          else
            body=$(printf '%s\n\n%s\n' \
              "The Article Index now lists **${ARTICLES} articles** across **${AREAS} product areas**. This updates the README badges to match." \
              'Opened automatically by the `Update README badges` workflow.')
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title 'Update README badge counts' \
              --body "$body"
          fi
