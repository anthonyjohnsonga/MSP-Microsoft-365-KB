name: Update README badges

# Recounts the Article Index table and rewrites the article/product-area
# badge numbers in README.md so they never drift from the actual content.
# The fix is committed straight to main — an earlier PR-based version could only
# propose the change, and badges sat stale for six days when nobody merged it.

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-badges
  cancel-in-progress: false

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Recount and push badge values
        run: |
          set -euo pipefail

          git config user.name  'anthonyjohnsonga'
          git config user.email 'anthony@johnson2.us'

          # Recount the index and rewrite the badges against whatever README.md
          # is currently checked out. Sets $articles / $areas for the commit message.
          recount_and_rewrite() {
            # Index rows are the only lines whose first cell is bold: | **Area** | ...
            articles=$(grep -cE '^\|[[:space:]]*\*\*' README.md)

            # Distinct bold values in the first cell = product areas.
            areas=$(grep -oE '^\|[[:space:]]*\*\*[^*]+\*\*' README.md \
              | sed -E 's/^\|[[:space:]]*\*\*//; s/\*\*$//' \
              | sort -u | wc -l)

            if [ "$articles" -eq 0 ] || [ "$areas" -eq 0 ]; then
              echo "::error::Parsed 0 articles or 0 areas — the Article Index table format changed."
              exit 1
            fi

            echo "Found $articles articles across $areas product areas."

            sed -i -E \
              -e "s|badge/articles-[0-9]+-|badge/articles-${articles}-|" \
              -e "s|badge/product%20areas-[0-9]+-|badge/product%20areas-${areas}-|" \
              README.md
          }

          # Two attempts: if a push lands between checkout and push, reset onto it and
          # recount against the new content rather than clobbering it with stale numbers.
          for attempt in 1 2; do
            recount_and_rewrite

            if git diff --quiet -- README.md; then
              echo "Badges already up to date."
              exit 0
            fi

            git add README.md
            git commit -m "Update README badge counts to ${articles} articles / ${areas} areas"

            if git push origin HEAD:main; then
              echo "Badges updated on main: ${articles} articles / ${areas} areas."
              exit 0
            fi

            echo "Push rejected — main moved. Resetting onto it and recounting."
            git fetch origin main
            git reset --hard origin/main
          done

          echo "::error::Could not push the badge update — main kept moving underneath this run."
          exit 1
